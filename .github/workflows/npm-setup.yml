name: npm setup (one-off)
# One-off, with the existing NPM_TOKEN: mark 0.1.0 deprecated (its exports had no default
# condition, so CommonJS could not load it) and register this repository's publish.yml as the
# npm Trusted Publisher (GitHub Actions OIDC), so publishing no longer needs a token.
# Idempotent; removed once publishing runs through OIDC.
on:
  push:
    branches: [main]
    paths: [".github/workflows/npm-setup.yml"]
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.10.0 && npm --version
      - name: Deprecate 0.1.0
        run: |
          for p in @x402jp/safe-buy; do
            if [ -n "$(npm view "$p@0.1.0" deprecated 2>/dev/null)" ]; then echo "$p@0.1.0 already deprecated"; continue; fi
            npm deprecate "$p@0.1.0" "CommonJS (require) cannot load 0.1.0. Use 0.1.1 or later."
            echo "deprecated $p@0.1.0"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Register the Trusted Publisher (GitHub Actions, publish.yml)
        continue-on-error: true
        run: |
          for p in @x402jp/safe-buy; do
            npm trust github "$p" --repo "${{ github.repository }}" --file publish.yml --yes || echo "trust: failed for $p"
            npm trust list "$p" || true
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
