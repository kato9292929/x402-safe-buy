name: publish (npm)
# Publishes @x402jp/safe-buy from main when the version in package.json is not on npm yet.
# Bump the version in a PR; merging it publishes. Published through npm Trusted Publishing
# (GitHub Actions OIDC): no token; the package lists this repository and publish.yml on npmjs.com.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # npm provenance
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.10.0 # Trusted Publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Publish if this version is not on npm yet
        run: |
          name=$(node -p "require('./package.json').name"); version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is already on npm"; else npm publish --access public; fi
